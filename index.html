
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subway Surfers Competitive</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: #111820;
  color: white;
  font-family: Arial, sans-serif;
}
canvas { display: block; }
#hud {
  position: fixed;
  top: 15px;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 35px;
  font-weight: bold;
  pointer-events: none;
}
#fps { position: fixed; top: 10px; right: 10px; }
#potato {
  position: fixed;
  bottom: 15px;
  left: 15px;
}
</style>
</head>
<body>
<div id="hud">
  <div>SCORE <span id="score">0</span></div>
  <div>MULTIPLIER x1</div>
  <div>BEST 0</div>
</div>
<div id="fps">FPS --</div>
<label id="potato">
  <input type="checkbox"> Potato Graphics
</label>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x263b4a);

const camera = new THREE.PerspectiveCamera(
  70, innerWidth / innerHeight, 0.1, 1000
);
camera.position.set(0, 5, 10);
camera.lookAt(0, 0, -10);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 2));

const ground = new THREE.Mesh(
  new THREE.BoxGeometry(12, 0.2, 100),
  new THREE.MeshStandardMaterial({color: 0x454b50})
);
ground.position.z = -35;
scene.add(ground);

// Three railway lanes
for (let lane = -1; lane <= 1; lane++) {
  const rail = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 0.15, 100),
    new THREE.MeshStandardMaterial({color: 0xb6bec5})
  );
  rail.position.set(lane * 3, 0.2, -35);
  scene.add(rail);
}

// Test train
const train = new THREE.Mesh(
  new THREE.BoxGeometry(2.3, 3, 5),
  new THREE.MeshStandardMaterial({color: 0xc64d45})
);
train.position.set(0, 1.7, -12);
scene.add(train);

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
